# 시험 3개 — A 만 허용, B · C 는 거부되어야 한다
apiVersion: v1
kind: Namespace
metadata: {name: lab-secure}
---
# A. api-defense-lab CI 가 서명 · SBOM 증명한 이미지 → 허용
apiVersion: v1
kind: Pod
metadata: {name: a-signed-ours, namespace: lab-secure}
spec:
  containers:
    - name: tools
      image: ghcr.io/zeldaim/api-defense-lab/tools:latest
      command: ["python", "-c", "import sklearn; print('ok', sklearn.__version__)"]
  restartPolicy: Never
---
# B. 서명이 없는 이미지 → 거부
apiVersion: v1
kind: Pod
metadata: {name: b-unsigned, namespace: lab-secure}
spec:
  containers:
    - {name: web, image: "docker.io/library/nginx:1.27-alpine"}
  restartPolicy: Never
---
# C. 서명은 있지만 다른 신원(Chainguard 의 CI)이 서명한 이미지 → 거부
apiVersion: v1
kind: Pod
metadata: {name: c-signed-by-others, namespace: lab-secure}
spec:
  containers:
    - {name: cosign, image: "cgr.dev/chainguard/cosign:latest", args: ["version"]}
  restartPolicy: Never
