# VAmPI 앞단 프록시 — 표준 접근 로그(combined)를 남기기 위한 인프라 설정. 앱 코드는 건드리지 않는다.
events {}
http {
  log_format combined_xff '$http_x_client_ip - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /logs/access.log combined_xff;
  server {
    listen 80;
    location / { proxy_pass http://vampi:5000; proxy_set_header Host $host; }
  }
}
