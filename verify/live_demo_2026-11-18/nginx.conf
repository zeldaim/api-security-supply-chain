# 실시간 시연용 nginx — 접속 기록 + 차단 목록(blocked/ips.map). 목록 파일이 바뀌면 컨테이너 안 루프가 nginx -s reload.
events {}
http {
  log_format combined_xff '$http_x_client_ip - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /logs/access.log combined_xff;
  map $http_x_client_ip $blocked { default 0; include /etc/nginx/blocked/ips.map; }
  server {
    listen 80;
    location / {
      if ($blocked) { return 403 '{"detail":"blocked by SOC auto-response"}'; }
      proxy_pass http://web:8091; proxy_set_header Host $host;
    }
  }
}
