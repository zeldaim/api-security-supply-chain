# Grafana 기본 Elasticsearch 데이터 소스 3개 (to_es.py 가 만드는 인덱스)
apiVersion: 1
datasources:
  - {name: DVRA 요청, uid: dvra-access, type: elasticsearch, access: proxy, url: "http://es-local:9200",
     jsonData: {index: dvra-access, timeField: timestamp}}
  - {name: DVRA Shadow 경보, uid: dvra-alerts, type: elasticsearch, access: proxy, url: "http://es-local:9200",
     jsonData: {index: wazuh-alerts-dvra, timeField: timestamp}}
  - {name: DVRA ML, uid: dvra-ml, type: elasticsearch, access: proxy, url: "http://es-local:9200",
     jsonData: {index: dvra-ml, timeField: timestamp}}
