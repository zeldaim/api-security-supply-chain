# Event-Driven Ansible rulebook v2 — v1(wazuh_alerts.yml) + BOLA 계정 정지 (2026-11-10)
#
# v1 과 차이: 맨 위에 BOLA 열거(룰 100931) 규칙 추가 → 계정 정지 + client_ip 차단.
#   v1 에서는 100931(L12) 경보에 srcip 가 없어 차단 규칙을 지나쳐 알림만 됐다.
#   v1 파일은 기록으로 그대로 둔다.
#
# 실행 (response/ 폴더에서):
#   EDA_WEBHOOK_TOKEN=<토큰> ansible-rulebook -r rulebooks/wazuh_alerts_v2.yml -i inventory/hosts_v2.yml \
#       --env-vars EDA_WEBHOOK_TOKEN -v
#
# 규칙은 위에서부터 보고, 처음 맞은 규칙 하나만 실행한다 (match_multiple_rules 기본 false)
- name: Wazuh 경보 대응 v2
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: "{{ EDA_WEBHOOK_TOKEN }}"

  rules:
    - name: BOLA 열거 (남의 객체 5분 3개 이상 성공) → 계정 정지 + 출발지 IP 차단
      condition: event.payload.rule.id == "100931"
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.data.user_id
      action:
        run_playbook:
          name: playbooks/bola_response.yml

    - name: 높은 위험 + 출발지 IP → 차단 플레이북 (기본 notify 모드면 기록만)
      condition: >-
        event.payload.rule.level >= 12 and event.payload.data.srcip is defined
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.data.srcip
      action:
        run_playbook:
          name: playbooks/block_ip.yml

    - name: 중간 위험 → 알림 (BOLA 1건 100930 L10 도 여기)
      condition: event.payload.rule.level >= 7
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.rule.id
      action:
        run_playbook:
          name: playbooks/notify.yml
