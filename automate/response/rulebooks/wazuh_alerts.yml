# Event-Driven Ansible rulebook — Wazuh 경보(웹훅) → 플레이북
#
# 실행 (response/ 폴더에서):
#   EDA_WEBHOOK_TOKEN=<토큰> ansible-rulebook -r rulebooks/wazuh_alerts.yml -i inventory/hosts.yml \
#       --env-vars EDA_WEBHOOK_TOKEN -v
#
# 규칙은 위에서부터 보고, 처음 맞은 규칙 하나만 실행한다 (match_multiple_rules 기본 false)
# 같은 출발지 IP 는 5분에 한 번만 대응 (throttle) — 공격 한 번에 알림 수백 개 방지
- name: Wazuh 경보 대응
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: "{{ EDA_WEBHOOK_TOKEN }}"

  rules:
    - name: 높은 위험 + 출발지 IP → 차단 플레이북 (기본 notify 모드면 기록만)
      condition: >-
        event.payload.rule.level >= 12 and event.payload.data.srcip is defined
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.data.srcip
      action:
        run_playbook:
          name: playbooks/block_ip.yml

    - name: 중간 위험 → 알림
      condition: event.payload.rule.level >= 7
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.rule.id
      action:
        run_playbook:
          name: playbooks/notify.yml
