# API-BOM 자동 생성 → Wazuh 룰 자동 생성 (NTIA SBOM 최소 요소의 "자동화 지원" 요건)
#
# 내부 정보(팀 레포 web/src 소스) → CycloneDX 1.6 API-BOM → OpenAPI 허용 목록 → Wazuh shadow API 룰
# 사람이 하는 일은 api-bom/baseline/baseline.csv 의 decision 승인(PR) 하나뿐이다.
# 결과 파일은 Actions 실행 화면의 Artifacts(api-bom-<번호>)와 Summary 에서 본다.
# 단계 내용은 api-bom/run_pipeline.sh 와 같다 (로컬에서도 같은 스크립트로 재현).

name: api-bom

on:
  push:
    branches: [main]
    paths: ["api-bom/**", "team_src/**", ".github/workflows/api-bom.yml"]
  pull_request:
    paths: ["api-bom/**", "team_src/**", ".github/workflows/api-bom.yml"]
  # 쇼핑몰 소스는 이 레포 team_src/ 스냅샷 (2026-11-06 팀 레포와 분리). 매일 한 번 다시 만든다 — 소스가 같아도 취약점 DB 가 바뀌므로
  schedule:
    - cron: "30 20 * * *"   # 05:30 KST (DT 피드 갱신 ~04:00 KST 후 1.5시간 여유)
  workflow_dispatch:

permissions:
  contents: write

# 결과 커밋끼리 충돌하지 않게 한 번에 하나씩 (2026-11-05 run #73·#74 충돌)
concurrency:
  group: api-bom
  cancel-in-progress: false

jobs:
  api-bom:
    runs-on: ubuntu-latest
    steps:
      - name: 이 저장소 가져오기
        uses: actions/checkout@v4

      # 2026-11-06 팀 레포 main 강제 초기화 → 팀 레포 checkout 대신 이 레포의 team_src/ 스냅샷 사용 (팀 레포와 분리)
      # 아래 단계들은 그대로 team_one/ 경로를 쓰므로 복사만 한다
      - name: 팀 소스 스냅샷 준비 (쇼핑몰 소스 · Wazuh 룰 생성기 · 이미지 SBOM)
        run: cp -r team_src team_one

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치 (룰 생성기 + 분석 라이브러리)
        run: |
          pip install pyyaml "cyclonedx-python-lib[json-validation]==11.12.0"
          pip install "pandas>=2.0" "scikit-learn>=1.3" "numpy>=1.24"

      - name: 파이프라인 실행 (extract → cyclonedx → validate → openapi → rules → test)
        run: bash api-bom/run_pipeline.sh team_one out

      - name: 재현 검사 (고정 스냅샷으로 다시 만들어 커밋된 결과물과 비교)
        run: bash api-bom/reproduce.sh

      - name: 서버 배포 번들 만들기 (Wazuh 룰 + 설치·롤백 스크립트 + 체크섬)
        run: bash api-bom/deploy/make_bundle.sh team_one

      - name: 배포 스크립트 시험 (가짜 Wazuh 디렉터리 — 설치·백업·롤백·변조 거부)
        run: bash api-bom/deploy/test_deploy_scripts.sh api-bom/out/deploy/shadow-api-*/

      # ── SBOM 직접 생성 (2026-11-05) ─────────────────────────────────────────
      # 팀이 커밋해 둔 SBOM 을 복사만 하면 팀 코드가 바뀌어도 SBOM 이 안 바뀐다 → 팀 소스(public)로 직접 만든다.
      # 팀 sbom.yml 과 같은 방식(Dockerfile 빌드 → syft). 토큰 불필요. 빌드 실패 시 팀 커밋본으로 대체(아래 저장 단계).
      # DT 4.13.2 는 CycloneDX 1.7 을 거부 → 1.6 으로 고정 (트러블슈팅 TS-025)
      - name: 웹 이미지 빌드 (팀 web/src/Dockerfile)
        id: build
        if: always()
        continue-on-error: true
        run: mkdir -p out && docker build -t shop-web:ci team_one/web/src

      - name: 이미지 SBOM 생성 (syft)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: shop-web:ci
          format: cyclonedx-json@1.6
          output-file: out/sbom-image.cdx.json
          upload-artifact: false

      - name: 소스 SBOM 생성 (syft)
        if: always()
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: team_one
          format: cyclonedx-json@1.6
          output-file: out/sbom-source.cdx.json
          upload-artifact: false

      - name: Grype 설치
        if: always()
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype 취약점 스캔
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          grype sbom:out/sbom-image.cdx.json -o json  > out/grype.json
          grype sbom:out/sbom-image.cdx.json -o table > out/grype_summary.md
          echo "[Grype] $(jq '.matches | length' out/grype.json) 취약점"

      - name: 관계 그래프 + 공격체인 분석
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python api-bom/graph/build_relations.py \
            --sbom     out/sbom-image.cdx.json \
            --vulns    out/grype_summary.md \
            --out-csv  out/risk.csv \
            --out-html out/dashboard.html
          python tools/threat_correlate.py \
            --risk-csv out/risk.csv \
            --out-csv  out/attack_chain.csv \
            --out-html out/attack_chain_dashboard.html

      - name: 결과 요약
        if: always()
        run: |
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          { echo; echo '### 재현 검사'; echo '```'; tail -3 api-bom/out/repro/REPORT.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          { echo; echo '### Grype 취약점 현황'; echo '```'; head -6 out/grype_summary.md 2>/dev/null || echo '(없음)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-bom-${{ github.run_number }}
          path: |
            out/
            api-bom/out/repro/REPORT.txt
            api-bom/out/deploy/*.tar.gz
          if-no-files-found: warn
          retention-days: 90

      # sbom/results/YYYY-MM-DD_runNNNN/ 에 실행별로 누적 저장
      # api-bom/graph/ · api-bom/baseline/ 은 건드리지 않으므로 DT 연동·대시보드에 영향 없음
      # 정기·수동 실행만 저장 (push·PR 실행은 검사만 — VM daily 커밋이 push 실행을 부르므로)
      # 실행마다 새 폴더 sbom/results/<날짜>_run<번호>/ — 덮어쓰지 않고 버전별로 쌓는다
      - name: SBOM·API-BOM 결과 실행별 저장
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          # 팀 레포를 못 받았으면 저장하지 않는다 (빈 결과가 이전 결과를 덮어쓰지 않게 — run #71, 2026-11-05)
          [ -d team_one/web/src ] || { echo "팀 소스 스냅샷 없음 — 저장 안 함"; exit 0; }
          DATE=$(date -u +%Y-%m-%d)
          DIR="sbom/results/${DATE}_run$(printf %04d ${{ github.run_number }})"
          mkdir -p "$DIR"

          # 이미지·소스 SBOM: 이번 실행에서 직접 만든 것 우선, 없으면 팀 레포에 커밋된 최신본
          ORIGIN_IMG=none; ORIGIN_SRC=none
          if [ -s out/sbom-image.cdx.json ]; then cp out/sbom-image.cdx.json "$DIR/sbom-image.cdx.json"; ORIGIN_IMG="generated (docker build team_one/web/src + syft)"
          else
            TEAM_SBOM=$(ls team_one/docs/sbom/results/*/sbom-image.cdx.json 2>/dev/null | sort | tail -1)
            [ -n "$TEAM_SBOM" ] && cp "$TEAM_SBOM" "$DIR/sbom-image.cdx.json" && ORIGIN_IMG="team committed: $TEAM_SBOM (빌드 실패로 대체)"
          fi
          if [ -s out/sbom-source.cdx.json ]; then cp out/sbom-source.cdx.json "$DIR/sbom-source.cdx.json"; ORIGIN_SRC="generated (syft dir:team_one)"
          else
            TEAM_SRC=$(ls team_one/docs/sbom/results/*/sbom-source.cdx.json 2>/dev/null | sort | tail -1)
            [ -n "$TEAM_SRC" ] && cp "$TEAM_SRC" "$DIR/sbom-source.cdx.json" && ORIGIN_SRC="team committed: $TEAM_SRC"
          fi

          # API-BOM 파이프라인 결과
          [ -f out/api-bom.cdx.json ]              && cp out/api-bom.cdx.json              "$DIR/api-bom.cdx.json"
          [ -f out/shadow_api_rules.xml ]           && cp out/shadow_api_rules.xml          "$DIR/shadow_api_rules.xml"
          [ -f out/summary.md ]                     && cp out/summary.md                    "$DIR/pipeline-summary.md"
          # 재현 검사 결과 (Actions artifact 90일 삭제 → 레포에 영구 보존)
          [ -f api-bom/out/repro/REPORT.txt ]       && cp api-bom/out/repro/REPORT.txt      "$DIR/repro-report.txt"
          # Grype + 분석 결과
          [ -f out/grype.json ]                    && cp out/grype.json                    "$DIR/grype.json"
          [ -f out/grype_summary.md ]              && cp out/grype_summary.md              "$DIR/grype_summary.md"
          [ -f out/risk.csv ]                      && cp out/risk.csv                      "$DIR/risk.csv"
          [ -f out/attack_chain.csv ]              && cp out/attack_chain.csv              "$DIR/attack_chain.csv"
          [ -f out/dashboard.html ]                && cp out/dashboard.html                "$DIR/dashboard.html"
          [ -f out/attack_chain_dashboard.html ]   && cp out/attack_chain_dashboard.html   "$DIR/attack_chain_dashboard.html"

          # 메타 (팀 소스 커밋·실행 번호)
          TEAM_COMMIT=$(sed -n 's/^team_commit=//p' team_one/SNAPSHOT.txt | cut -c1-7); TEAM_COMMIT=${TEAM_COMMIT:-unknown}
          printf "run: %s\nteam_commit: %s\ndate: %s\ngenerated_at: %s\nsbom_image: %s\nsbom_source: %s\n" \
            "${{ github.run_number }}" "$TEAM_COMMIT" "$DATE" "$(date -u +%FT%TZ)" "$ORIGIN_IMG" "$ORIGIN_SRC" > "$DIR/meta.txt"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR/"
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "chore(sbom): ${DATE} 자동 수집 (run #${{ github.run_number }}, ${{ github.event_name }}, team ${TEAM_COMMIT})"
          git pull --rebase   # VM daily·승인 서버가 먼저 push 했을 수 있음
          git push
