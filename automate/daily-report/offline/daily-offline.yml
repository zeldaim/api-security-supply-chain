# 실습 서버(VM 192.168.0.141)가 꺼진 날 자동 백업 — OFFLINE=1 로 daily.sh 실행
#
# 건너뛰는 단계 (VM/실습망 필요):  ① WEB 로그 SSH 수집  ③ 블랙박스 스캔  ⑥ DT 업로드  ⑦ DT 대시보드
# 실행되는 단계 (GitHub Actions):  ④ 인벤토리 합치기  ⑤ 새 후보 계산  ⑧ 자동 보안 일일 보고서 → 커밋·push
#
# 타이밍: 10:35 KST (VM cron 10:30 KST 보다 5분 뒤) — VM이 살아 있으면 중복 커밋 없이 넘어감

name: daily-offline

on:
  schedule:
    - cron: "35 1 * * *"   # 10:35 KST
  workflow_dispatch:         # 수동 실행 (VM 꺼진 날 직접 트리거)

permissions:
  contents: write

concurrency:
  group: daily-offline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 커밋·push 에 필요

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          pip install pyyaml "cyclonedx-python-lib[json-validation]==11.12.0"
          pip install "pandas>=2.0" "scikit-learn>=1.3" "numpy>=1.24"

      - name: git 사용자 설정
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 일일 인벤토리 + 보안 보고서 (오프라인 모드)
        env:
          OFFLINE:    "1"      # ① SSH 로그 수집·③ 블랙박스 스캔 건너뜀
          DAILY_PUSH: "1"      # 보고서 커밋 후 push
          PYTHONUTF8: "1"
        run: bash api-bom/inventory/daily.sh

      - name: 결과 요약
        if: always()
        run: |
          LATEST=$(ls -d reports/auto/*.md 2>/dev/null | sort | tail -1)
          if [ -n "$LATEST" ]; then
            echo "### 오늘 보안 일일 보고서 (OFFLINE)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -40 "$LATEST" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "보고서 없음 (daily.sh 출력 확인)" >> "$GITHUB_STEP_SUMMARY"
          fi
